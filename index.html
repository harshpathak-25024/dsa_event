<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Way - Set 1</title>
    <!-- Import Retro 8-bit Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <!-- Confetti Animation Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            background-color: #0a191e; 
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 2px, transparent 2px);
            background-size: 30px 30px;
            color: #ffffff; 
            text-align: center; 
            padding-top: 40px; 
            padding-bottom: 40px;
            font-family: 'VT323', monospace; 
        }
        .container { 
            max-width: 700px; 
            margin: auto; 
            background: #152b33; 
            padding: 40px; 
            border: 4px solid #d872ff; 
            box-shadow: 10px 10px 0px rgba(0,0,0,0.8); 
            position: relative;
        }
        h1 { 
            font-family: 'Press Start 2P', cursive; 
            font-size: 24px;
            color: #ffffff; 
            text-shadow: 4px 4px 0px #b055d3; 
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            color: #ffcc00; 
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #000;
        }
        
        /* Retro Timer Styling */
        #timer-display {
            font-family: 'Press Start 2P', cursive;
            font-size: 32px;
            color: #ffcc00;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 30px;
            padding: 10px;
            background: #000;
            border: 4px solid #555;
            display: inline-block;
            border-radius: 5px;
        }

        .level-row {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 15px;
            margin: 15px 0;
        }
        button { 
            font-family: 'VT323', monospace;
            font-size: 22px; 
            color: #fff; 
            border: 4px solid #fff;
            padding: 10px 15px; 
            cursor: pointer; 
            flex-grow: 1;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s;
        }
        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }
        
        .open-btn {
            background-color: #4caf50; 
            border-color: #ffffff;
        }
        .open-btn:hover { background-color: #3e8e41; }
        
        button:disabled {
            background-color: #333;
            border-color: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: 4px 4px 0px #111;
        }
        .unlock-btn {
            background-color: #d872ff;
            color: #000;
            font-weight: bold;
            flex-grow: 0;
            border-color: #fff;
        }
        .unlock-btn:hover { background-color: #b055d3; }
        
        .victory-btn {
            background-color: #ffcc00 !important;
            color: #000 !important;
            border-color: #fff !important;
            font-weight: bold;
        }

        input[type="text"] {
            font-family: 'VT323', monospace;
            font-size: 20px;
            padding: 10px;
            border: 4px solid #555;
            background: #000;
            color: #39ff14; 
            width: 120px;
            text-align: center;
            text-transform: uppercase;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #d872ff;
        }
        input[type="text"]:disabled {
            background: #222;
            color: #555;
            border-color: #333;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Find Your Way</h1>
    <h2>--- Set 1 ---</h2>
    
    <!-- Timer Display -->
    <div id="timer-display">20:00</div>
    
    <!-- Level 1 (Open) -->
    <div class="level-row">
        <button class="open-btn" onclick="window.open('https://blockly.games/maze?lang=en&level=3&&skin=0', '_blank')">
            Level 1: Blockly [Open]
        </button>
    </div>

    <!-- Level 2 -->
    <div class="level-row">
        <button id="btn-2" disabled onclick="window.open('https://blockly.games/maze?lang=en&level=4&&skin=0', '_blank')">
            Level 2: Blockly [Locked]
        </button>
        <input type="text" id="input-2" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-2" onclick="verifyLevel(2, 'PASS2', 'Level 2: Blockly')">Unlock</button>
    </div>

    <!-- Level 3 -->
    <div class="level-row">
        <button id="btn-3" disabled onclick="window.open('https://blockly.games/maze?lang=en&level=6&&skin=0', '_blank')">
            Level 3: Blockly [Locked]
        </button>
        <input type="text" id="input-3" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-3" onclick="verifyLevel(3, 'PASS3', 'Level 3: Blockly')">Unlock</button>
    </div>

    <!-- Level 4 -->
    <div class="level-row">
        <button id="btn-4" disabled onclick="window.open('https://blockly.games/maze?lang=en&level=8&&skin=0', '_blank')">
            Level 4: Blockly [Locked]
        </button>
        <input type="text" id="input-4" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-4" onclick="verifyLevel(4, 'PASS4', 'Level 4: Blockly')">Unlock</button>
    </div>

    <!-- Level 5 -->
    <div class="level-row">
        <button id="btn-5" disabled onclick="window.open('https://puzzles.twistymaze.com/untangle', '_blank')">
            Level 5: Untangle (6 Nodes)
        </button>
        <input type="text" id="input-5" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-5" onclick="verifyLevel(5, 'PASS5', 'Level 5: Untangle (6 Nodes)')">Unlock</button>
    </div>

    <!-- Level 6 -->
    <div class="level-row">
        <button id="btn-6" disabled onclick="window.open('https://puzzles.twistymaze.com/untangle', '_blank')">
            Level 6: Untangle (10 Nodes)
        </button>
        <input type="text" id="input-6" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-6" onclick="verifyLevel(6, 'PASS6', 'Level 6: Untangle (10 Nodes)')">Unlock</button>
    </div>

    <!-- Level 7 -->
    <div class="level-row">
        <button id="btn-7" disabled onclick="window.open('https://puzzles.twistymaze.com/untangle', '_blank')">
            Level 7: Untangle (15 Nodes)
        </button>
        <input type="text" id="input-7" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-7" onclick="verifyLevel(7, 'PASS7', 'Level 7: Untangle (15 Nodes)')">Unlock</button>
    </div>

    <!-- FINAL COMPLETION ROW -->
    <div class="level-row" style="margin-top: 40px;">
        <button id="btn-win" disabled>
            --- FINISH LINE ---
        </button>
        <input type="text" id="input-win" placeholder="PASSCODE" style="width: 140px;">
        <button class="unlock-btn" id="unlock-btn-win" onclick="verifyVictory('SET1COMPLETED')">Unlock</button>
    </div>
</div>

<script>
    // Timer Variables
    let timeRemaining = 20 * 60; // 20 minutes in seconds
    let timerInterval = null;
    let timerStarted = false;

    function startTimer() {
        if (timerStarted) return; // Prevent multiple timers
        timerStarted = true;
        
        let display = document.getElementById('timer-display');
        display.style.color = '#39ff14'; // Turn neon green when running
        display.style.borderColor = '#39ff14';

        timerInterval = setInterval(() => {
            timeRemaining--;
            
            let minutes = Math.floor(timeRemaining / 60);
            let seconds = timeRemaining % 60;
            
            // Add leading zero if needed
            let minStr = minutes < 10 ? '0' + minutes : minutes;
            let secStr = seconds < 10 ? '0' + seconds : seconds;
            
            display.innerText = `${minStr}:${secStr}`;

            // Warning colors when low on time
            if (timeRemaining <= 60) {
                display.style.color = '#ff0044'; // Flashing red for last minute
                display.style.borderColor = '#ff0044';
            }

            // Time's Up
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                display.innerText = "GAME OVER";
                
                // Disable all remaining inputs so they can't continue
                let allInputs = document.querySelectorAll('input[type="text"]');
                allInputs.forEach(input => input.disabled = true);
                
                let allUnlockBtns = document.querySelectorAll('.unlock-btn');
                allUnlockBtns.forEach(btn => btn.disabled = true);
                
                alert("TIME IS UP! Better luck next time!");
            }
        }, 1000);
    }

    function verifyLevel(levelNum, correctPassword, levelLabel) {
        let input = document.getElementById(`input-${levelNum}`);
        let mainBtn = document.getElementById(`btn-${levelNum}`);
        let unlockBtn = document.getElementById(`unlock-btn-${levelNum}`);

        if (input.value.trim().toUpperCase() === correctPassword.toUpperCase()) {
            
            // Start the timer specifically when Level 2 is unlocked
            if (levelNum === 2) {
                startTimer();
            }

            mainBtn.disabled = false;
            mainBtn.classList.add('open-btn');
            mainBtn.innerText = `${levelLabel} [PLAY]`;
            
            input.style.display = 'none';
            unlockBtn.style.display = 'none';
        } else {
            alert("INCORRECT PASSCODE. CALL THE HOST!");
            input.value = ""; 
        }
    }

    function verifyVictory(correctPassword) {
        let input = document.getElementById('input-win');
        let mainBtn = document.getElementById('btn-win');
        let unlockBtn = document.getElementById('unlock-btn-win');

        if (input.value.trim().toUpperCase() === correctPassword.toUpperCase()) {
            
            // Stop the timer so they can see their final completion time
            clearInterval(timerInterval);
            let display = document.getElementById('timer-display');
            display.style.color = '#ffcc00'; 
            display.style.borderColor = '#ffcc00';

            mainBtn.disabled = false;
            mainBtn.classList.add('victory-btn');
            mainBtn.innerText = "🏆 MISSION ACCOMPLISHED 🏆";
            
            input.style.display = 'none';
            unlockBtn.style.display = 'none';

            // Fire the Confetti!
            var count = 250;
            var defaults = {
                origin: { y: 0.7 },
                zIndex: 10000
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });

        } else {
            alert("INCORRECT PASSCODE. COMPLETE LEVEL 7 FIRST!");
            input.value = ""; 
        }
    }
</script>

</body>
</html>
