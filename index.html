<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Challenge - Set 1 (v2.0)</title>
    <style>
        body { 
            font-family: monospace; 
            background-color: #1e1e1e; 
            color: #00ff00; 
            text-align: center; 
            padding-top: 30px; 
        }
        .container { 
            max-width: 650px; 
            margin: auto; 
            background: #2d2d2d; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        h1 { margin-bottom: 20px; color: #ffffff; }
        button { 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            margin: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 5px; 
            width: 85%; 
            transition: 0.3s; 
        }
        button:hover { background-color: #45a049; }
        .locked { background-color: #555; }
        .locked:hover { background-color: #777; }
        .unlocked { background-color: #008CBA; }
        .unlocked:hover { background-color: #007399; }
    </style>
</head>
<body>

<div class="container">
    <h1>DSA Game Progression: Set 1</h1>
    
    <!-- Level 1 (Open) -->
    <button onclick="window.open('https://blockly.games/maze?lang=en&level=3&&skin=0', '_blank')">
        Level 1: Blockly Maze 3 (Open)
    </button>

    <!-- Blockly Levels (Locked) -->
    <button id="btn-2" class="locked" onclick="checkPassword('Level 2', 'pass2', 'https://blockly.games/maze?lang=en&level=4&&skin=0', 'btn-2')">
        Level 2: Blockly Maze 4 (Locked)
    </button>

    <button id="btn-3" class="locked" onclick="checkPassword('Level 3', 'pass3', 'https://blockly.games/maze?lang=en&level=6&&skin=0', 'btn-3')">
        Level 3: Blockly Maze 6 (Locked)
    </button>

    <button id="btn-4" class="locked" onclick="checkPassword('Level 4', 'pass4', 'https://blockly.games/maze?lang=en&level=8&&skin=0', 'btn-4')">
        Level 4: Blockly Maze 8 (Locked)
    </button>

    <!-- Untangle Levels (Locked) -->
    <button id="btn-5" class="locked" onclick="checkPassword('Level 5', 'pass5', 'https://puzzles.twistymaze.com/untangle', 'btn-5')">
        Level 5: Untangle - Set to 6 Nodes (Locked)
    </button>

    <button id="btn-6" class="locked" onclick="checkPassword('Level 6', 'pass6', 'https://puzzles.twistymaze.com/untangle', 'btn-6')">
        Level 6: Untangle - Set to 10 Nodes (Locked)
    </button>

    <button id="btn-7" class="locked" onclick="checkPassword('Level 7', 'pass7', 'https://puzzles.twistymaze.com/untangle', 'btn-7')">
        Level 7: Untangle - Set to 15 Nodes (Locked)
    </button>
</div>

<script>
    function checkPassword(levelName, correctPassword, targetUrl, buttonId) {
        let btn = document.getElementById(buttonId);

        if (btn.classList.contains('unlocked')) {
            window.open(targetUrl, '_blank');
            return;
        }

        let guess = prompt(`Enter the password for ${levelName}.\n(Call the host over to verify your screen to get the password!)`);
        
        if (guess === correctPassword) {
            btn.classList.remove('locked');
            btn.classList.add('unlocked');
            btn.innerText = levelName + " (Unlocked ✓)";

            let anchor = document.createElement('a');
            anchor.href = targetUrl;
            anchor.target = '_blank';
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        } else if (guess !== null) {
            alert("Incorrect password. Solve the previous level first!");
        }
    }
</script>

</body>
</html>
