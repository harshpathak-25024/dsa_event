<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Way - Set 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            background-color: #0a191e; 
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 2px, transparent 2px);
            background-size: 30px 30px;
            color: #ffffff; 
            text-align: center; 
            padding-top: 40px; 
            padding-bottom: 40px;
            font-family: 'VT323', monospace; 
        }
        .container { 
            max-width: 700px; 
            margin: auto; 
            background: #152b33; 
            padding: 40px; 
            border: 4px solid #d872ff; 
            box-shadow: 10px 10px 0px rgba(0,0,0,0.8); 
            position: relative;
        }
        h1 { 
            font-family: 'Press Start 2P', cursive; 
            font-size: 24px;
            color: #ffffff; 
            text-shadow: 4px 4px 0px #b055d3; 
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            color: #ffcc00; 
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #000;
        }

        /* Top Bar with Score */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            border: 4px solid #555;
            padding: 10px 20px;
            margin-bottom: 30px;
        }
        .score-display {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            color: #39ff14;
        }

        /* Team Registration Box */
        .team-box {
            background: #111;
            border: 4px solid #39ff14;
            padding: 20px;
            margin-bottom: 30px;
        }
        .team-box p { font-size: 20px; }

        .level-row {
            display: flex; justify-content: center; align-items: stretch; gap: 15px; margin: 15px 0;
            opacity: 0.3; pointer-events: none; transition: all 0.3s;
        }
        .level-row.active { opacity: 1; pointer-events: auto; }
        
        button { 
            font-family: 'VT323', monospace; font-size: 22px; color: #fff; 
            border: 4px solid #fff; padding: 10px 15px; cursor: pointer; 
            flex-grow: 1; text-transform: uppercase; box-shadow: 4px 4px 0px #000;
        }
        button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000; }
        
        .open-btn { background-color: #4caf50; border-color: #ffffff; }
        .open-btn:hover { background-color: #3e8e41; }
        .tutorial-btn { background-color: #008CBA; margin-bottom: 25px; width: 100%; opacity: 1!important; pointer-events: auto!important;}
        
        button:disabled { background-color: #333; border-color: #555; color: #888; cursor: not-allowed; box-shadow: 4px 4px 0px #111; }
        
        .unlock-btn { background-color: #d872ff; color: #000; font-weight: bold; flex-grow: 0; border-color: #fff; }
        .unlock-btn:hover { background-color: #b055d3; }
        .victory-btn { background-color: #ffcc00 !important; color: #000 !important; border-color: #fff !important; font-weight: bold; }

        input[type="text"] {
            font-family: 'VT323', monospace; font-size: 20px; padding: 10px;
            border: 4px solid #555; background: #000; color: #39ff14; 
            width: 120px; text-align: center; text-transform: uppercase;
        }
        input[type="text"]:focus { outline: none; border-color: #d872ff; }

        .sync-text { display: block; font-size: 16px; margin-top: 5px; color: #ffcc00; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Find Your Way</h1>
    <h2>--- Set 1 ---</h2>
    
    <div class="top-bar">
        <span class="score-display" id="team-name-display">TEAM: [WAITING]</span>
        <span class="score-display">SCORE: <span id="total-score">0</span></span>
    </div>

    <button class="tutorial-btn" onclick="alert('Tutorial opens here!')">? HOW TO PLAY (TUTORIAL)</button>

    <!-- Team Registration -->
    <div class="team-box" id="team-setup">
        <p>ENTER TEAM NAME TO START TIMER</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <input type="text" id="team-name" placeholder="TEAM NAME" style="width: 200px;">
            <button class="open-btn" style="flex-grow: 0;" onclick="startSession()">START</button>
        </div>
    </div>

    <div class="level-row" id="row-trial">
        <button class="open-btn" onclick="window.open('https://blockly.games/maze?lang=en&level=3&&skin=0', '_blank')">Trial Run: Blockly [Play Now]</button>
    </div>

    <!-- Levels -->
    <div class="level-row" id="row-1">
        <button id="btn-1" disabled onclick="window.open('https://blockly.games/maze?lang=en&level=4&&skin=0', '_blank')">Level 1 (10 pts) [Locked]</button>
        <input type="text" id="input-1" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-1" onclick="verifyLevel(1, 'PASS1', 'Level 1', 10)">Unlock</button>
        <div class="sync-text" id="sync-1">Syncing...</div>
    </div>

    <div class="level-row" id="row-2">
        <button id="btn-2" disabled onclick="window.open('https://blockly.games/maze?lang=en&level=6&&skin=0', '_blank')">Level 2 (15 pts) [Locked]</button>
        <input type="text" id="input-2" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-2" onclick="verifyLevel(2, 'PASS2', 'Level 2', 15)">Unlock</button>
        <div class="sync-text" id="sync-2">Syncing...</div>
    </div>

    <div class="level-row" id="row-3">
        <button id="btn-3" disabled onclick="window.open('https://blockly.games/maze?lang=en&level=8&&skin=0', '_blank')">Level 3 (25 pts) [Locked]</button>
        <input type="text" id="input-3" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-3" onclick="verifyLevel(3, 'PASS3', 'Level 3', 25)">Unlock</button>
        <div class="sync-text" id="sync-3">Syncing...</div>
    </div>

    <div class="level-row" id="row-4">
        <button id="btn-4" disabled onclick="window.open('https://puzzles.twistymaze.com/untangle', '_blank')">Level 4 (10 pts) [Locked]</button>
        <input type="text" id="input-4" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-4" onclick="verifyLevel(4, 'PASS4', 'Level 4', 10)">Unlock</button>
        <div class="sync-text" id="sync-4">Syncing...</div>
    </div>

    <div class="level-row" id="row-5">
        <button id="btn-5" disabled onclick="window.open('https://puzzles.twistymaze.com/untangle', '_blank')">Level 5 (15 pts) [Locked]</button>
        <input type="text" id="input-5" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-5" onclick="verifyLevel(5, 'PASS5', 'Level 5', 15)">Unlock</button>
        <div class="sync-text" id="sync-5">Syncing...</div>
    </div>

    <div class="level-row" id="row-6">
        <button id="btn-6" disabled onclick="window.open('https://puzzles.twistymaze.com/untangle', '_blank')">Level 6 (25 pts) [Locked]</button>
        <input type="text" id="input-6" placeholder="PASSCODE">
        <button class="unlock-btn" id="unlock-btn-6" onclick="verifyLevel(6, 'PASS6', 'Level 6', 25)">Unlock</button>
        <div class="sync-text" id="sync-6">Syncing...</div>
    </div>

    <!-- FINAL COMPLETION ROW -->
    <div class="level-row" id="row-win" style="margin-top: 40px;">
        <button id="btn-win" disabled>--- FINISH LINE ---</button>
        <input type="text" id="input-win" placeholder="PASSCODE" style="width: 140px;">
        <button class="unlock-btn" id="unlock-btn-win" onclick="verifyVictory('SET1COMPLETED')">Unlock</button>
    </div>
</div>

<script>
    // ==========================================
    // PASTE YOUR GOOGLE SCRIPT URL HERE:
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw0JMmLJ3-Z1HadmTWkX_EnK3CVkMFLg-Sx7Jo0sh_LDOPZ6nvpAcrAWiqZkVT2OGrp6g/exec";
    // ==========================================

    let currentScore = 0;
    let currentTeam = "";
    let startTime = 0;

    function startSession() {
        let nameInput = document.getElementById('team-name').value.trim();
        if (nameInput === "") { alert("ENTER TEAM NAME!"); return; }
        
        currentTeam = nameInput;
        document.getElementById('team-name-display').innerText = "TEAM: " + currentTeam;
        
        // Start background timer
        startTime = Date.now();
        
        // Hide setup box and unlock all rows visually
        document.getElementById('team-setup').style.display = 'none';
        document.getElementById('row-trial').classList.add('active');
        for(let i=1; i<=6; i++) document.getElementById(`row-${i}`).classList.add('active');
        document.getElementById('row-win').classList.add('active');
    }

    function verifyLevel(levelNum, correctPassword, levelLabel, points) {
        let input = document.getElementById(`input-${levelNum}`);
        let mainBtn = document.getElementById(`btn-${levelNum}`);
        let unlockBtn = document.getElementById(`unlock-btn-${levelNum}`);
        let syncText = document.getElementById(`sync-${levelNum}`);

        if (input.value.trim().toUpperCase() === correctPassword.toUpperCase()) {
            
            // Add Points
            currentScore += points;
            document.getElementById('total-score').innerText = currentScore;
            
            // Update UI
            mainBtn.disabled = false;
            mainBtn.classList.add('open-btn');
            mainBtn.innerText = `${levelLabel} [PLAY]`;
            input.style.display = 'none';
            unlockBtn.style.display = 'none';
            
            // Send to Google Sheets
            syncText.style.display = 'block';
            let fetchUrl = `${WEB_APP_URL}?team=${encodeURIComponent(currentTeam)}&level=${levelNum}&score=${points}&total=${currentScore}`;
            
            fetch(fetchUrl, { mode: 'no-cors' })
                .then(() => { syncText.innerText = "+"+points+" Sync OK!"; setTimeout(() => syncText.style.display='none', 3000); })
                .catch(() => { syncText.innerText = "Sync Failed"; });
                
        } else {
            alert("INCORRECT PASSCODE. CALL THE HOST!");
            input.value = ""; 
        }
    }

    function verifyVictory(correctPassword) {
        let input = document.getElementById('input-win');
        let mainBtn = document.getElementById('btn-win');
        let unlockBtn = document.getElementById('unlock-btn-win');

        if (input.value.trim().toUpperCase() === correctPassword.toUpperCase()) {
            
            // Check Timer for Bonus
            let elapsedMinutes = (Date.now() - startTime) / 60000;
            let timeBonus = 0;
            
            if (elapsedMinutes <= 20) {
                timeBonus = 10;
                currentScore += timeBonus;
                document.getElementById('total-score').innerText = currentScore;
                alert("⚡ SPEED BONUS! Under 20 minutes! +10 Points! ⚡");
            }

            // Update UI
            mainBtn.disabled = false;
            mainBtn.classList.add('victory-btn');
            mainBtn.innerText = "🏆 MISSION ACCOMPLISHED 🏆";
            input.style.display = 'none';
            unlockBtn.style.display = 'none';

            // Send Final Bonus & Total to Sheets
            if (timeBonus > 0) {
                let fetchUrl = `${WEB_APP_URL}?team=${encodeURIComponent(currentTeam)}&level=bonus&score=${timeBonus}&total=${currentScore}`;
                fetch(fetchUrl, { mode: 'no-cors' });
            }

            // Confetti
            var count = 250;
            var defaults = { origin: { y: 0.7 }, zIndex: 10000 };
            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, { particleCount: Math.floor(count * particleRatio) }));
            }
            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });

        } else {
            alert("INCORRECT PASSCODE. COMPLETE LEVEL 6 FIRST!");
            input.value = ""; 
        }
    }
</script>

</body>
</html>
